name: release

# Full release pipeline in ONE chained run: release-please -> docker
# build+push to ECR Public -> np artifact registration -> release finalized
# with the artifact metadata (image, digest, pinned reference, artifact id).
#
# Chained on purpose: release-please creates tags with GITHUB_TOKEN, and
# GitHub never triggers workflows from bot-token events.
#
# Recovery / backfill: dispatch with existing_tag to publish + finalize a tag
# that already exists.
#
# Configure: secrets AWS_ROLE_ARN_ECR_PUSH + ARTIFACT_NP_API_KEY, variable
# NP_ARTIFACT_NRN.
#
# Package publishing applies static-files/publish at the release tag with the pushed
# digest: the scope as a package visible to every organization. It reuses
# ARTIFACT_NP_API_KEY (the publisher organization key, also allowed to write
# specs, scope types and packages) and needs the organization secrets
# PACKAGE_STATE_AWS_ACCOUNT_ID, PACKAGE_TFSTATE_BUCKET and PACKAGE_TFSTATE_REGION;
# the shared workflow skips it until PACKAGE_TFSTATE_BUCKET is set. The state
# role is github-actions-<repository>-package-state in that account, by
# convention; AWS_ROLE_ARN_PACKAGE_STATE overrides it for a fork whose role is
# named otherwise, and is not set here. Account, bucket and region are secrets,
# not variables: this repository is public and so are its run logs, and GitHub
# masks only secrets.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      existing_tag:
        description: 'Publish + finalize an existing tag (recovery/backfill)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write   # OIDC auth against AWS for the ECR push and the package state

jobs:
  release:
    uses: nullplatform/actions-nullplatform/.github/workflows/release-publish-oci.yml@v1
    with:
      image_name: scopes/static-files
      existing_tag: ${{ inputs.existing_tag || '' }}
      # Publishes the scope as a global package from this release's specs and
      # image (static-files/publish).
      package_stack_dir: static-files/publish
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
      artifact_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
      package_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
      package_state_aws_account_id: ${{ secrets.PACKAGE_STATE_AWS_ACCOUNT_ID }}
      package_state_role_arn: ${{ secrets.AWS_ROLE_ARN_PACKAGE_STATE }}
      package_state_bucket: ${{ secrets.PACKAGE_TFSTATE_BUCKET }}
      package_state_region: ${{ secrets.PACKAGE_TFSTATE_REGION }}
